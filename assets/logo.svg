<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="topRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#cc0000"/>
    </linearGradient>
    <linearGradient id="leftBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0055b3"/>
    </linearGradient>
    <linearGradient id="rightGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bed9f"/>
      <stop offset="100%" stop-color="#2ed573"/>
    </linearGradient>
    <linearGradient id="greenText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="cubeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#081c15" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 3D Cube Assembly -->
  <g transform="translate(300, 150)" filter="url(#cubeShadow)">
    <!-- Top Face (Red Diamond) -->
    <polygon points="0,-75 65,-37.5 0,0 -65,-37.5" fill="url(#topRed)" />
    <polygon points="0,-65 50,-36 0,-7 -50,-36" fill="#ff7979" opacity="0.4"/>
    
    <!-- Left Block (M - Blue) -->
    <path d="M -65,-35 L 0,2.5 L 0,85 L -65,47.5 Z" fill="url(#leftBlue)"/>
    <!-- M cutout/highlight effect -->
    <path d="M -50,-25 L -15,-5 L -15,65 L -50,45 Z" fill="#70a1ff" opacity="0.3"/>
    
    <!-- Right Block (B - Green) -->
    <path d="M 0,2.5 L 65,-35 L 65,47.5 L 0,85 Z" fill="url(#rightGreen)"/>
    <!-- B cutout/highlight effect -->
    <path d="M 15,-5 L 50,-25 L 50,45 L 15,65 Z" fill="#7bed9f" opacity="0.3"/>
    
    <!-- Center Line Accents -->
    <line x1="0" y1="2.5" x2="0" y2="85" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Brand Name Typography -->
  <text x="300" y="325" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="800" font-size="58" fill="url(#greenText)" text-anchor="middle" letter-spacing="-1">motion&amp;beat</text>
  
  <!-- Slogan Typography -->
  <text x="300" y="375" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="500" font-size="24" fill="#2d3748" text-anchor="middle" letter-spacing="0.5">el ritmo que mueve tu empresa</text>
</svg>
